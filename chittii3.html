<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chitii - Digital Name Picker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --error: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #818cf8, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 16px;
            color: var(--text);
            font-size: 1rem;
            resize: vertical;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #334155;
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        .display-container {
            margin-top: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 16px;
            border: 1px dashed #334155;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        #scroller {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-muted);
            word-break: break-word;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        #scroller.shuffling {
            color: #f43f5e;
            transform: scale(1.05);
        }

        #scroller.winner {
            color: var(--accent);
            font-size: 2.3rem;
            animation: celebrate 0.5s ease forwards;
        }

        @keyframes celebrate {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .error-msg {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 8px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <h1>Chitii</h1>
            <p>The Seamless Digital Name Picker</p>
        </header>

        <section class="input-group">
            <label for="namesInput">Enter Names (One per line)</label>
            <textarea id="namesInput" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
            <div id="error" class="error-msg" role="alert">Please enter at least 2 names to begin.</div>
        </section>

        <button id="drawBtn" class="btn" onclick="startShuffle()">Draw a Name</button>

        <section class="display-container" aria-live="polite">
            <div id="scroller">Awaiting names...</div>
        </section>
    </main>

    <script>
        let isShuffling = false;

        function startShuffle() {
            if (isShuffling) return;

            const input = document.getElementById('namesInput').value;
            const scroller = document.getElementById('scroller');
            const drawBtn = document.getElementById('drawBtn');
            const error = document.getElementById('error');

            // Parse names and sanitize empty lines
            const names = input
                .split('\n')
                .map(name => name.trim())
                .filter(name => name.length > 0);

            // Validation check
            if (names.length < 2) {
                error.style.display = 'block';
                return;
            }
            error.style.display = 'none';

            // Select fair random winner
            const winnerIndex = Math.floor(Math.random() * names.length);
            const selectedWinner = names[winnerIndex];

            // UI Lockdown during shuffle
            isShuffling = true;
            drawBtn.disabled = true;
            drawBtn.textContent = 'Shuffling...';
            scroller.className = 'shuffling';

            let delay = 50;
            const duration = 3000;
            const startTime = Date.now();

            function step() {
                const elapsed = Date.now() - startTime;

                if (elapsed < duration) {
                    // Show random name frame
                    const randomName = names[Math.floor(Math.random() * names.length)];
                    scroller.textContent = randomName;

                    // Dynamically slow down interval towards the end
                    if (elapsed > duration - 1000) {
                        delay += 15;
                    }

                    setTimeout(step, delay);
                } else {
                    // Reveal winner
                    scroller.textContent = selectedWinner;
                    scroller.className = 'winner';
                    drawBtn.disabled = false;
                    drawBtn.textContent = 'Draw Another Name';
                    isShuffling = false;
                }
            }

            step();
        }
    </script>
</body>
</html>
